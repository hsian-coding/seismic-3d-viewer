[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tecton-seismic-api"
version = "0.2.0"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.34,<1.0",
  "pydantic-settings>=2.8,<3.0",
  "duckdb>=1.3,<2.0",
  "polars>=1.30,<2.0",
  "pyarrow>=20,<26",
  "anyio>=4.8,<5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
